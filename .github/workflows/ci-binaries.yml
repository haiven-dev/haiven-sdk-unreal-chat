name: Binary release script

# Tests for the binary packager. They do not compile Unreal, publish a
# release, or use a self-hosted runner.
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: ["main", "sdk-dev"]

permissions:
  contents: read

concurrency:
  group: ci-binaries-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  binary-script:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Binary script tests
        run: python3 -m unittest discover -s ci -p 'test_binary_release.py' -v
